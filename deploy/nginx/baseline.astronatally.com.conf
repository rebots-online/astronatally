server {
    listen 80;
    server_name baseline.astronatally.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name baseline.astronatally.com;
    ssl_certificate     /etc/nginx/ssl/astronatally.com_P256/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/astronatally.com_P256/private.key;

    root /var/www/baseline.astronatally.com;
    index index.html;

    location /billing/ {
        proxy_pass          http://127.0.0.1:38471;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
